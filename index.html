<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pixelmaps — tile cartograms</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f1;
        --panel: #ffffff;
        --ink: #1a1a1a;
        --muted: #6b6b6b;
        --border: #d8d8d4;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--ink);
        display: grid;
        grid-template-columns: 280px 1fr;
        min-height: 100vh;
      }
      aside {
        background: var(--panel);
        border-right: 1px solid var(--border);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .subtitle { font-size: 12px; color: var(--muted); margin: 0; }
      label { font-size: 12px; font-weight: 600; display: block; margin-bottom: 4px; }
      select, input[type="range"], input[type="number"], button {
        width: 100%;
        font: inherit;
        padding: 6px 8px;
        border: 1px solid var(--border);
        border-radius: 4px;
        background: white;
      }
      button {
        background: var(--ink);
        color: white;
        border: none;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover { background: #333; }
      .modeBtn {
        flex: 1;
        padding: 6px 4px;
        font-size: 12px;
        background: white;
        color: var(--ink);
        border: 1px solid var(--border);
      }
      .modeBtn.active { background: var(--ink); color: white; border-color: var(--ink); }
      .modeBtn:hover { background: #f0f0ee; color: var(--ink); }
      .modeBtn.active:hover { background: #333; color: white; }
      .row { display: flex; gap: 8px; align-items: center; }
      .row > * { flex: 1; }
      .stat { font-size: 11px; color: var(--muted); }
      main {
        padding: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #stage {
        background: white;
        border: 1px solid var(--border);
        max-width: 100%;
        max-height: 90vh;
      }
      .legend {
        font-size: 11px;
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px 8px;
      }
      .legend > div { display: flex; align-items: center; gap: 6px; }
      .legend .sw { width: 10px; height: 10px; border: 1px solid rgba(0,0,0,.2); }
    </style>
  </head>
  <body>
    <aside>
      <div>
        <h1>Pixelmaps</h1>
        <p class="subtitle">Tile cartograms from geography + a data weight.</p>
      </div>

      <div>
        <label for="geography">Geografia</label>
        <select id="geography">
          <option value="spain">Espanya (CCAA)</option>
          <option value="catalonia">Catalunya (comarques)</option>
          <option value="europe">Europa (NUTS-2)</option>
        </select>
      </div>

      <div>
        <label for="dataset">Dataset</label>
        <select id="dataset"></select>
      </div>

      <div>
        <label for="year">Any</label>
        <select id="year"></select>
      </div>

      <div>
        <label>Mode</label>
        <div id="modePicker" style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px;">
          <button type="button" data-mode="cartogram" class="modeBtn active">Equilibrat</button>
          <button type="button" data-mode="dorling" class="modeBtn">Diferències</button>
          <button type="button" data-mode="scaled" class="modeBtn">Escalat</button>
        </div>
      </div>

      <div id="tilesRow">
        <label for="tiles">Blocs totals: <span id="tilesLabel">1000</span></label>
        <input id="tiles" type="range" min="200" max="5000" step="50" value="1000" />
      </div>

      <div>
        <label class="row" style="gap: 6px; align-items: center; font-weight: 600;">
          <input id="showCities" type="checkbox" checked style="width: auto; flex: 0;" />
          Marca capitals (color fosc)
        </label>
      </div>

      <div class="stat" id="tileMeta"></div>

      <div class="row">
        <button id="download">Exporta PNG</button>
      </div>

      <div>
        <label>Legend</label>
        <div class="legend" id="legend"></div>
      </div>

      <p class="stat" id="status"></p>
    </aside>

    <main>
      <svg id="stage" viewBox="0 0 900 800" xmlns="http://www.w3.org/2000/svg"></svg>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
